services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: real-rails-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./real-rails-backend/data:/app/data:ro
    networks:
      - rail-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_MAPBOX_TOKEN: ""
    container_name: real-rails-frontend
    restart: unless-stopped
    environment:
      - PORT=3000
      - API_URL=http://real-rails-backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rail-net

networks:
  rail-net:
    driver: bridge